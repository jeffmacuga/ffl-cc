name: CBS data refresh

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cbs-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-automation.txt

      - name: Install automation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-automation.txt
          python -m pip install playwright

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Restore CBS login state
        env:
          CBS_STORAGE_STATE: ${{ secrets.CBS_STORAGE_STATE }}
        run: |
          if [ -z "$CBS_STORAGE_STATE" ]; then
            echo "Configure the CBS_STORAGE_STATE GitHub Actions secret." >&2
            exit 1
          fi
          mkdir -p .auth
          printf '%s' "$CBS_STORAGE_STATE" > .auth/cbs_state.json
          python -c 'import json; json.load(open(".auth/cbs_state.json", encoding="utf-8"))'

      - name: Refresh CBS teams, rosters, and standings
        run: python cbs_rosters.py

      - name: Commit refreshed database
        run: |
          if git diff --quiet -- fantasy.db; then
            echo "CBS database did not change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fantasy.db
          git commit -m "Refresh CBS league data"
          git push

      - name: Remove CBS login state
        if: always()
        run: rm -f .auth/cbs_state.json
