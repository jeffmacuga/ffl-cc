name: ESPN AFS lineup refresh

on:
  schedule:
    # Match the CBS schedule: Sunday morning Eastern and Thursday at 4 PM
    # Eastern, with Thursday's dual UTC entries gated for daylight saving.
    - cron: "0 13 * * 0"
    - cron: "0 20 * * 4"
    - cron: "0 21 * * 4"
  workflow_dispatch:
    inputs:
      submit:
        description: "Submit the optimized lineup if the first kickoff is within two hours"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: espn-afs-lineup
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ESPN_SWID: ${{ secrets.ESPN_SWID }}
      ESPN_S2: ${{ secrets.ESPN_S2 }}
      ESPN_AUTO_SUBMIT: ${{ vars.ESPN_AUTO_SUBMIT }}
    steps:
      - name: Check scheduled Eastern time
        id: schedule
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          run = True
          if os.environ["EVENT_NAME"] == "schedule":
              eastern = datetime.now(ZoneInfo("America/New_York"))
              cron = os.environ["SCHEDULE_CRON"]
              expected_cron = "0 20 * * 4" if eastern.dst() else "0 21 * * 4"
              if cron in {"0 20 * * 4", "0 21 * * 4"}:
                  run = (
                      eastern.weekday() == 3
                      and eastern.hour == 16
                      and cron == expected_cron
                  )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run={'true' if run else 'false'}\n")
          print("Proceeding with lineup refresh." if run else "Skipping; this is not the 4 PM Eastern Thursday run.")
          PY
      - uses: actions/checkout@v4
        if: steps.schedule.outputs.run == 'true'
      - uses: actions/setup-python@v5
        if: steps.schedule.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-automation.txt
      - name: Install automation dependencies
        if: steps.schedule.outputs.run == 'true'
        run: python -m pip install -r requirements-automation.txt
      - name: Refresh and optimize ESPN AFS lineup
        if: steps.schedule.outputs.run == 'true'
        env:
          MANUAL_SUBMIT: ${{ inputs.submit }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$MANUAL_SUBMIT" = "true" ]; then
              python -m scripts.espn_afs_automation --manual --submit
            else
              python -m scripts.espn_afs_automation --manual
            fi
          else
            python -m scripts.espn_afs_automation
          fi
