name: ESPN AFS lineup refresh

on:
  schedule:
    # Run hourly during common NFL game-day windows. The job checks the
    # confirmed schedule and only acts within 31 minutes before each target.
    - cron: "0 9-23 * * 0,1,4,6"
    # 00:00 UTC covers 19:00 Eastern during standard time.
    - cron: "0 0 * * 0,1,2,5"
  workflow_dispatch:
    inputs:
      submit:
        description: "Submit the optimized lineup if the first kickoff is within two hours"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: espn-afs-lineup
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ESPN_SWID: ${{ secrets.ESPN_SWID }}
      ESPN_S2: ${{ secrets.ESPN_S2 }}
      ESPN_AUTO_SUBMIT: ${{ vars.ESPN_AUTO_SUBMIT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-automation.txt
      - name: Install automation dependencies
        run: python -m pip install -r requirements-automation.txt
      - name: Refresh and optimize ESPN AFS lineup
        env:
          MANUAL_SUBMIT: ${{ inputs.submit }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$MANUAL_SUBMIT" = "true" ]; then
              python -m scripts.espn_afs_automation --manual --submit
            else
              python -m scripts.espn_afs_automation --manual
            fi
          else
            python -m scripts.espn_afs_automation
          fi
