name: CBS lineup refresh

on:
  schedule:
    # Sunday morning Eastern; the workflow gates Thursday's dual UTC entries
    # below so only the one that lands at 4 PM Eastern proceeds.
    - cron: "0 13 * * 0"
    - cron: "0 20 * * 4"
    - cron: "0 21 * * 4"
  workflow_dispatch:
    inputs:
      submit:
        description: "Submit the optimized CBS lineup now"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: cbs-lineup
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CBS_AUTO_SUBMIT: ${{ vars.CBS_AUTO_SUBMIT }}
    steps:
      - name: Check scheduled Eastern time
        id: schedule
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          run = True
          if os.environ["EVENT_NAME"] == "schedule":
              eastern = datetime.now(ZoneInfo("America/New_York"))
              cron = os.environ["SCHEDULE_CRON"]
              expected_cron = "0 20 * * 4" if eastern.dst() else "0 21 * * 4"
              if cron in {"0 20 * * 4", "0 21 * * 4"}:
                  run = (
                      eastern.weekday() == 3
                      and eastern.hour == 16
                      and cron == expected_cron
                  )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run={'true' if run else 'false'}\n")
          print("Proceeding with lineup refresh." if run else "Skipping; this is not the 4 PM Eastern Thursday run.")
          PY
      - uses: actions/checkout@v4
        if: steps.schedule.outputs.run == 'true'
      - uses: actions/setup-python@v5
        if: steps.schedule.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-automation.txt
      - name: Install automation dependencies
        if: steps.schedule.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-automation.txt
          python -m pip install playwright

      - name: Install Chromium
        if: steps.schedule.outputs.run == 'true'
        run: python -m playwright install --with-deps chromium
      - name: Restore CBS login state
        if: steps.schedule.outputs.run == 'true'
        env:
          CBS_STORAGE_STATE: ${{ secrets.CBS_STORAGE_STATE }}
        run: |
          if [ -z "$CBS_STORAGE_STATE" ]; then
            echo "Configure the CBS_STORAGE_STATE GitHub Actions secret." >&2
            exit 1
          fi
          mkdir -p .auth
          printf '%s' "$CBS_STORAGE_STATE" > .auth/cbs_state.json
          python -c 'import json; json.load(open(".auth/cbs_state.json", encoding="utf-8"))'
      - name: Refresh and optimize CBS lineup
        if: steps.schedule.outputs.run == 'true'
        env:
          MANUAL_SUBMIT: ${{ inputs.submit }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$MANUAL_SUBMIT" = "true" ]; then
              python -m scripts.cbs_lineup_automation --manual --submit
            else
              python -m scripts.cbs_lineup_automation --manual
            fi
          else
            python -m scripts.cbs_lineup_automation
          fi
      - name: Remove CBS login state
        if: always() && steps.schedule.outputs.run == 'true'
        run: rm -f .auth/cbs_state.json
